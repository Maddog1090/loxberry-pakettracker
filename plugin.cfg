[AUTHOR]
# AUTHOR.NAME/EMAIL sowie PLUGIN.NAME/FOLDER identifizieren das Plugin in
# LoxBerry dauerhaft und dürfen in späteren Versionen NIE geändert werden,
# sonst schlagen Updates fehl.
NAME=ToRe90
EMAIL=existenzz-cod2@gmx.de

[PLUGIN]
VERSION=0.2.2
# Nur Kleinbuchstaben, keine Leerzeichen. NAME = Skript-/Cron-Name,
# FOLDER = Installationsordner unter */plugins/.
NAME=pakettracker
FOLDER=pakettracker
# Max. 25 Zeichen
TITLE=Pakettracker
# Projektseite (Support-Link in der LoxBerry-Plugin-Verwaltung)
WEBSITE=https://github.com/Maddog1090/loxberry-pakettracker

[AUTOUPDATE]
# Updates kommen über GitHub Releases. Die Dateien release.cfg/prerelease.cfg
# erzeugt tools/build_release.py aus GITHUB_REPO und der Version oben.
# Die URLs werden bei der Installation in die LoxBerry-Plugin-Datenbank übernommen.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/Maddog1090/loxberry-pakettracker/main/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/Maddog1090/loxberry-pakettracker/main/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
# Benötigt den in LoxBerry integrierten MQTT-Broker (general.json) und Python >= 3.9
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
ARCHITECTURE=false
# Loglevel wird in der Plugin-Oberfläche eingestellt, nicht in der Plugin-Verwaltung
CUSTOM_LOGLEVELS=false
